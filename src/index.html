<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="title-bar">
    <div class="title-bar-drag"></div>
    <div class="title-bar-title">Helix</div>
    <div class="title-bar-controls">
      <button class="title-btn" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="title-btn" id="btn-maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="none" stroke="currentColor"/></svg>
      </button>
      <button class="title-btn title-btn-close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div id="app">
    <section id="sidebar">
      <div class="sidebar-header">
        <button id="open-repo-btn" class="btn-icon" title="打开仓库">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M15.5 5.5H5.5C4.95 5.5 4.5 5.95 4.5 6.5V14.5C4.5 15.05 4.95 15.5 5.5 15.5H13.5C14.05 15.5 14.5 15.05 14.5 14.5V2.5C14.5 1.95 14.05 1.5 13.5 1.5H2.5C1.95 1.5 1.5 1.95 1.5 2.5V14.5C1.5 15.05 1.95 15.5 2.5 15.5"/>
          </svg>
        </button>
        <span class="sidebar-title" data-i18n="sidebarRepos">仓库</span>
        <button id="settings-btn" class="btn-icon btn-settings" title="设置">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.4 3.4l.7.7M11.9 11.9l.7.7M3.4 12.6l.7-.7M11.9 4.1l.7-.7"/>
          </svg>
        </button>
      </div>
      <div id="repo-info" class="repo-info hidden">
        <div class="repo-name" id="repo-name"></div>
        <div class="repo-branch" id="repo-branch"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label" data-i18n="sectionBranches">分支</div>
        <div id="branch-list" class="branch-list">
          <div class="empty-state" data-i18n="noBranches">打开仓库以查看分支</div>
        </div>
        <button id="new-branch-btn" class="btn-secondary hidden" data-i18n="newBranch">+ 新建分支</button>
      </div>
      <div class="sidebar-section">
        <div class="section-label" data-i18n="sectionWorkingDir">工作区</div>
        <div id="status-summary" class="status-summary">
          <div class="empty-state" data-i18n="cleanTree">工作区干净</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <button id="fetch-btn" class="btn-secondary hidden" data-i18n="fetch">获取</button>
        <button id="pull-btn" class="btn-secondary hidden" data-i18n="pull">拉取</button>
        <button id="push-btn" class="btn-secondary hidden" data-i18n="push">推送</button>
      </div>
    </section>

    <main id="main-content">
      <header id="toolbar">
        <div class="toolbar-left">
          <button id="refresh-btn" class="btn-icon" title="刷新">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M14 8a6 6 0 0 1-6 6 6 6 0 0 1-6-6 6 6 0 0 1 6-6"/>
              <polyline points="10,1 14,1 14,5"/>
            </svg>
          </button>
          <div class="toolbar-title" id="toolbar-title">Helix</div>
        </div>
        <div class="toolbar-right" id="toolbar-actions"></div>
      </header>

      <div id="content-area">
        <div id="commit-section" class="panel">
          <div class="panel-header">
            <span data-i18n="commitHistory">提交历史</span>
            <span class="badge" id="commit-count">0</span>
          </div>
          <div id="commit-list" class="commit-list">
            <div class="welcome-state">
              <div class="welcome-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
                  <circle cx="24" cy="24" r="20"/>
                  <path d="M24 4a20 20 0 0 1 0 40"/>
                  <circle cx="24" cy="24" r="6"/>
                </svg>
              </div>
              <h2 id="welcome-title" data-i18n="welcomeTitle">欢迎使用 Helix</h2>
              <p id="welcome-desc" data-i18n="welcomeDesc">打开 Git 仓库以可视化提交历史、管理分支并查看变更 — 一切尽在流畅的界面中。</p>
              <button id="welcome-open-btn" class="btn-primary" data-i18n="openRepo">打开仓库</button>
            </div>
          </div>
        </div>

        <div id="detail-section" class="panel">
          <div class="panel-header">
            <span data-i18n="changes">变更</span>
            <div class="panel-tabs">
              <button class="tab active" data-tab="unstaged" data-i18n="unstaged">未暂存</button>
              <button class="tab" data-tab="staged" data-i18n="staged">已暂存</button>
              <button class="tab" data-tab="diff" data-i18n="diff">差异</button>
            </div>
          </div>
          <div id="detail-content" class="detail-content">
            <div class="empty-state" data-i18n="selectDetail">选择提交或文件查看详情</div>
          </div>
        </div>
      </div>

      <footer id="status-bar">
        <div class="status-left" id="status-left" data-i18n="ready">就绪</div>
        <div class="status-right"><span id="status-branch"></span></div>
      </footer>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span id="modal-title"></span>
        <button class="btn-icon modal-close" id="modal-close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <div id="modal-content"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
